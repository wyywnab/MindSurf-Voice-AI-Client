openapi: 3.1.0
info:
  title: MindSurf Voice HTTP API
  version: 2.0.0
  description: >-
    系统浏览器授权、Token、用户、额度、用量、文本处理能力发现和长期 WebSocket ticket。
    实时音频和文本事件由 WebSocket v2 定义。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.com
    description: Production example
  - url: http://127.0.0.1:8000
    description: Explicit development mode only
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Users
  - name: Quota
  - name: Capabilities
  - name: Realtime

paths:
  /v2/auth/authorize:
    get:
      tags: [Authentication]
      operationId: authorizeDesktopClient
      summary: 在系统浏览器中登录或注册并签发 Authorization Code
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            const: mindsurf-desktop
        - name: response_type
          in: query
          required: true
          schema:
            const: code
        - name: redirect_uri
          in: query
          required: true
          schema:
            const: mindsurf://auth/callback
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: code_challenge_method
          in: query
          required: true
          schema:
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43,512}$'
        - name: prompt
          in: query
          required: false
          schema:
            enum: [login, select_account]
      responses:
        '200':
          description: 浏览器认证页面；页面内部处理登录、注册、验证和找回密码
          content:
            text/html:
              schema:
                type: string
        '302':
          description: >-
            成功时回跳 code 和原 state；取消或失败时回跳稳定 error 和原 state。
            Location 不得包含 access token 或 refresh token。
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/auth/token:
    post:
      tags: [Authentication]
      operationId: exchangeAuthorizationCode
      summary: 使用 Authorization Code 和 PKCE verifier 创建登录 session
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeInput'
      responses:
        '200':
          description: code 已原子消费并返回当前用户的 token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/AuthorizationTokenBadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '403':
          $ref: '#/components/responses/AccountSuspended'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: 轮换 refresh token 并签发新 token pair
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: 刷新成功；旧 refresh token 已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccountSuspended'
        '409':
          description: 幂等 key 冲突、原结果已过期，或检测到已轮换 refresh token 被不同 key 重放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [idempotency_conflict, idempotency_result_expired, refresh_token_reused]
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 撤销当前登录 session、ticket 和长连接
      responses:
        '204':
          description: 已登出；对同一 session 的重试同样返回 204
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 获取当前用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/quota:
    get:
      tags: [Quota]
      operationId: getQuota
      summary: 获取当前计费周期额度和累计用量
      responses:
        '200':
          description: 当前额度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/usage:
    get:
      tags: [Quota]
      operationId: listUsage
      summary: 分页查询已结算的请求用量
      parameters:
        - name: from_ms
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: 查询半开区间 [from_ms, to_ms) 的起点。
        - name: to_ms
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: 查询半开区间 [from_ms, to_ms) 的终点，必须大于 from_ms。
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: 固定首次查询参数和快照水位的不透明签名游标。
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 用量分页；按 settled_at_ms 降序、request_id 升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: 获取当前用户可用的 ASR/LLM 文本处理能力
      responses:
        '200':
          description: 能力目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountSuspended'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v2/realtime/tickets:
    post:
      tags: [Realtime]
      operationId: createRealtimeTicket
      summary: 为长期 WebSocket Upgrade 签发一次性短时 ticket
      responses:
        '201':
          description: ticket 已签发；默认 30 秒内消费一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountSuspended'
        '429':
          description: HTTP 频率或实时连接数达到上限
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [rate_limit_exceeded, realtime_connection_limit]
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 每次逻辑操作生成的 UUID；同一操作的网络重试必须复用。
      schema:
        $ref: '#/components/schemas/UUID'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求字段或查询参数非法
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: invalid_request
    Unauthorized:
      description: access token 缺失、无效或过期
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [authentication_required, authentication_failed, authentication_expired]
    AuthenticationFailed:
      description: refresh 凭据无效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: authentication_failed
    AuthorizationTokenBadRequest:
      description: 请求结构非法，或 Authorization Code/PKCE grant 无效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [invalid_request, authorization_grant_invalid]
    AccountSuspended:
      description: 账户不可使用该接口
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: account_suspended
    RateLimited:
      description: 请求频率超限
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: rate_limit_exceeded
    InternalError:
      description: 未分类内部错误
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: server_error
    ServiceUnavailable:
      description: 服务临时不可用
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: service_unavailable
    IdempotencyConflict:
      description: 同一 Idempotency-Key 被用于不同请求
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        const: idempotency_conflict

  schemas:
    UUID:
      type: string
      format: uuid

    TimestampMs:
      type: integer
      minimum: 0

    RequestId:
      $ref: '#/components/schemas/UUID'

    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        error:
          $ref: '#/components/schemas/Error'

    Device:
      type: object
      additionalProperties: false
      required: [id, name, platform, app_version]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          type: string
          minLength: 1
          maxLength: 32
        app_version:
          type: string
          minLength: 1
          maxLength: 32

    AuthorizationCodeInput:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, code, code_verifier, redirect_uri, device]
      properties:
        grant_type:
          const: authorization_code
        client_id:
          const: mindsurf-desktop
        code:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
        code_verifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          writeOnly: true
        redirect_uri:
          const: mindsurf://auth/callback
        device:
          $ref: '#/components/schemas/Device'

    RefreshInput:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true

    TokenPair:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in]
      properties:
        token_type:
          const: Bearer
        access_token:
          type: string
          minLength: 1
          x-sensitive: true
        expires_in:
          type: integer
          minimum: 1
          description: 相对于本次响应时刻的 access token 真实剩余有效秒数；幂等重放时重新计算。
        refresh_token:
          type: string
          minLength: 1
          x-sensitive: true
        refresh_expires_in:
          type: integer
          minimum: 1
          description: 相对于本次响应时刻的 refresh token 真实剩余有效秒数；幂等重放时重新计算。

    User:
      type: object
      additionalProperties: false
      required: [user_id, display_name, login, status, plan, created_at_ms]
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        display_name:
          type: string
          minLength: 1
        login:
          type: string
          minLength: 1
        status:
          enum: [active, suspended]
        plan:
          type: string
          minLength: 1
        created_at_ms:
          $ref: '#/components/schemas/TimestampMs'

    AuthData:
      type: object
      additionalProperties: false
      required: [tokens, user]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'

    AuthResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/AuthData'

    UserResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/User'

    Period:
      type: object
      additionalProperties: false
      required: [starts_at_ms, ends_at_ms]
      properties:
        starts_at_ms:
          $ref: '#/components/schemas/TimestampMs'
        ends_at_ms:
          $ref: '#/components/schemas/TimestampMs'

    Credits:
      type: object
      additionalProperties: false
      required: [limit, used, reserved, remaining]
      properties:
        limit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0

    ResourceUsage:
      type: object
      additionalProperties: false
      required:
        - input_audio_ms
        - llm_input_tokens
        - llm_output_tokens
        - asr_credits_charged
        - llm_credits_charged
        - credits_charged
      properties:
        input_audio_ms:
          type: integer
          minimum: 0
        llm_input_tokens:
          type: integer
          minimum: 0
        llm_output_tokens:
          type: integer
          minimum: 0
        asr_credits_charged:
          type: integer
          minimum: 0
          description: 当前计费周期累计的 ASR credits。
        llm_credits_charged:
          type: integer
          minimum: 0
          description: 当前计费周期累计的 LLM 润色 credits。
        credits_charged:
          type: integer
          minimum: 0
          description: ASR 与 LLM 润色 credits 之和。

    Quota:
      type: object
      additionalProperties: false
      required: [plan, pricing_revision, period, credits, usage]
      properties:
        plan:
          type: string
          minLength: 1
        pricing_revision:
          type: string
          minLength: 1
        period:
          $ref: '#/components/schemas/Period'
        credits:
          $ref: '#/components/schemas/Credits'
        usage:
          $ref: '#/components/schemas/ResourceUsage'

    QuotaResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/Quota'

    Mode:
      enum: [asr_only, asr_llm]

    UsageEntry:
      type: object
      additionalProperties: false
      required:
        - request_id
        - mode
        - settled_at_ms
        - pricing_revision
        - input_audio_ms
        - llm_input_tokens
        - llm_output_tokens
        - asr_credits_charged
        - llm_credits_charged
        - credits_charged
      properties:
        request_id:
          $ref: '#/components/schemas/UUID'
        mode:
          $ref: '#/components/schemas/Mode'
        settled_at_ms:
          $ref: '#/components/schemas/TimestampMs'
        pricing_revision:
          type: string
          minLength: 1
        input_audio_ms:
          type: integer
          minimum: 0
        llm_input_tokens:
          type: integer
          minimum: 0
        llm_output_tokens:
          type: integer
          minimum: 0
        asr_credits_charged:
          type: integer
          minimum: 0
          description: 本请求结算的 ASR credits。
        llm_credits_charged:
          type: integer
          minimum: 0
          description: 本请求结算的 LLM 润色 credits。
        credits_charged:
          type: integer
          minimum: 0
          description: 本请求两个计费分项之和。

    UsageList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageEntry'
        next_cursor:
          type: [string, 'null']

    UsageListResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/UsageList'

    NamedOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    Selection:
      type: object
      additionalProperties: false
      required: [asr, llm]
      properties:
        asr:
          type: string
          minLength: 1
        llm:
          type: [string, 'null']

    NumberControl:
      type: object
      additionalProperties: false
      description: minimum、default、maximum 必须依次非递减。
      required: [type, minimum, maximum, default]
      properties:
        type:
          const: number
        minimum:
          type: number
        maximum:
          type: number
        default:
          type: number

    IntegerControl:
      type: object
      additionalProperties: false
      description: minimum、default、maximum 必须依次非递减且全部为整数。
      required: [type, minimum, maximum, default]
      properties:
        type:
          const: integer
        minimum:
          type: integer
        maximum:
          type: integer
        default:
          type: integer

    GenerationControl:
      oneOf:
        - $ref: '#/components/schemas/NumberControl'
        - $ref: '#/components/schemas/IntegerControl'

    Pipeline:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - modes
        - max_recording_ms
        - asr_options
        - llm_options
        - generation_controls
      properties:
        id:
          type: string
          minLength: 1
          description: 不透明业务 ID，不携带 mode 或模型语义。
        name:
          type: string
          minLength: 1
        description:
          type: string
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Mode'
        max_recording_ms:
          type: integer
          minimum: 1
        asr_options:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        llm_options:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        generation_controls:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GenerationControl'

    DefaultModeSelection:
      type: object
      additionalProperties: false
      required: [pipeline, selection]
      properties:
        pipeline:
          type: string
          minLength: 1
        selection:
          $ref: '#/components/schemas/Selection'

    ModeDefaults:
      type: object
      additionalProperties: false
      required: [asr_only, asr_llm]
      properties:
        asr_only:
          $ref: '#/components/schemas/DefaultModeSelection'
        asr_llm:
          $ref: '#/components/schemas/DefaultModeSelection'

    RealtimeCapability:
      type: object
      additionalProperties: false
      description: websocket_path 仅用于建连前预览；实际建连以 ticket 响应中的路径为准。
      required: [websocket_path, ticket_path, subprotocol, persistent]
      properties:
        websocket_path:
          type: string
          pattern: '^/[^/].*'
        ticket_path:
          const: /v2/realtime/tickets
        subprotocol:
          const: mindsurf.voice.v2
        persistent:
          const: true

    Capabilities:
      type: object
      additionalProperties: false
      description: >-
        defaults 是各 mode 默认 Pipeline 和 selection 的唯一权威来源。各类 ID 必须在各自集合内
        唯一；Pipeline option 引用和 defaults 引用必须存在并满足 mode、selection 与 generation
        control 的跨资源不变量。违反这些不变量时客户端必须拒绝整个 revision。
      required:
        - protocol_version
        - revision
        - realtime
        - modes
        - pipelines
        - asr_options
        - llm_options
        - recognition_languages
        - defaults
      properties:
        protocol_version:
          const: 2
        revision:
          type: string
          minLength: 1
        realtime:
          $ref: '#/components/schemas/RealtimeCapability'
        modes:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Mode'
        pipelines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Pipeline'
        asr_options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamedOption'
        llm_options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamedOption'
        recognition_languages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        defaults:
          $ref: '#/components/schemas/ModeDefaults'

    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/Capabilities'

    RealtimeTicket:
      type: object
      additionalProperties: false
      description: websocket_path 是本次 ticket 建连的唯一权威路径。
      required: [ticket, expires_at_ms, websocket_path, subprotocol]
      properties:
        ticket:
          type: string
          minLength: 32
          x-sensitive: true
          description: 一次性短时 opaque ticket；日志必须脱敏。
        expires_at_ms:
          $ref: '#/components/schemas/TimestampMs'
        websocket_path:
          type: string
          pattern: '^/[^/].*'
          description: 客户端必须使用本字段建连，不得由 capabilities 路径或硬编码路径覆盖。
        subprotocol:
          const: mindsurf.voice.v2

    RealtimeTicketResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/RealtimeTicket'
