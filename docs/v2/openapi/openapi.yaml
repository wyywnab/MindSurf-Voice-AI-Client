openapi: 3.1.0
info:
  title: MindSurf Voice HTTP API
  version: 2.0.0-draft
  description: |
    MindSurf Voice API v2 的 HTTP 机器契约。实时音频与请求控制由同级
    WebSocket v2 规范定义。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.com
    description: Production example
  - url: http://127.0.0.1:8000
    description: Explicit development mode only
security:
  - bearerAuth: []
tags:
  - name: Capabilities
  - name: Voices
  - name: Voice References
  - name: Conversations
paths:
  /v2/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: 获取当前用户的业务能力目录
      responses:
        '200':
          description: 能力目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v2/voices:
    get:
      tags: [Voices]
      operationId: listVoices
      summary: 查询当前用户可见的音色
      parameters:
        - name: selectable
          in: query
          required: false
          description: 省略时返回全部；true/false 分别筛选可选或不可选音色。
          schema:
            type: boolean
      responses:
        '200':
          description: 完整音色列表；内置按 id 升序，自建按 created_at_ms 降序、id 升序。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceListResponse'
        '400':
          $ref: '#/components/responses/ListVoicesBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Voices]
      operationId: createVoice
      summary: 创建用户音色
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVoiceInput'
      responses:
        '202':
          description: 已接受异步处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVoiceResponse'
        '400':
          $ref: '#/components/responses/CreateVoiceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CreateVoiceForbidden'
        '409':
          $ref: '#/components/responses/CreateVoiceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v2/voices/{voice_id}:
    parameters:
      - $ref: '#/components/parameters/VoiceId'
    get:
      tags: [Voices]
      operationId: getVoice
      summary: 查询音色及异步处理状态
      responses:
        '200':
          description: 完整音色资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VoiceNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Voices]
      operationId: updateVoice
      summary: 修改自建音色的默认情绪
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoiceInput'
      responses:
        '200':
          description: 修改后的完整音色资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponse'
        '400':
          $ref: '#/components/responses/UpdateVoiceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VoiceNotFound'
        '409':
          $ref: '#/components/responses/UpdateVoiceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Voices]
      operationId: deleteVoice
      summary: 删除自建音色
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VoiceNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/voices/{voice_id}/references:
    parameters:
      - $ref: '#/components/parameters/VoiceId'
    post:
      tags: [Voice References]
      operationId: createVoiceReference
      summary: 增加情绪参考版本
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReferenceInput'
      responses:
        '202':
          description: 已接受异步处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReferenceResponse'
        '400':
          $ref: '#/components/responses/CreateReferenceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/VoiceNotFound'
        '409':
          $ref: '#/components/responses/CreateReferenceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v2/voices/{voice_id}/references/{reference_id}:
    parameters:
      - $ref: '#/components/parameters/VoiceId'
      - $ref: '#/components/parameters/ReferenceId'
    get:
      tags: [Voice References]
      operationId: getVoiceReference
      summary: 查询情绪参考处理状态
      responses:
        '200':
          description: 情绪参考资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VoiceReferenceNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Voice References]
      operationId: deleteVoiceReference
      summary: 删除情绪参考
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VoiceReferenceNotFound'
        '409':
          $ref: '#/components/responses/DeleteReferenceConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v2/conversations/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: 删除 confirmed conversation 的后端上下文
      description: |
        不存在或不属于当前用户的 ID 同样返回 204。只有当前用户自己的活跃
        conversation 返回 409 conversation_active。
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DeleteConversationConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        仅在同步校验通过并原子接受异步任务时消费，失败的同步校验不占用 Key；
        当前用户范围内从成功写入接受事务起至少保留 24 小时。并发的相同指纹只创建
        一个资源，其他请求等待后重放。相同指纹重放仍返回 202 和首次接受时
        相同的 data，但为本次 HTTP 尝试生成新的 request_id；当前资源状态通过 GET 查询。
        指纹按规范化方法、路径、校验后字段、基础媒体类型和文件原始字节 SHA-256 计算，
        不包含 multipart boundary、part 顺序、文件名、传输头顺序或媒体类型参数。
      schema:
        type: string
        format: uuid
    VoiceId:
      name: voice_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ReferenceId:
      name: reference_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NoContent:
      description: 成功；响应体必须为空。
    BadRequest:
      description: 请求字段、查询参数或 multipart 无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400Response'
    Unauthorized:
      description: 缺少、无效或过期鉴权。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401Response'
    Forbidden:
      description: 当前可见资源或能力不允许该操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403Response'
    NotFound:
      description: 资源不存在或为避免越权泄露而隐藏。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404Response'
    VoiceNotFound:
      description: 音色不存在，或为避免越权泄露而隐藏。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoiceNotFoundError404Response'
    VoiceReferenceNotFound:
      description: 音色或情绪参考不存在，或为避免越权泄露而隐藏。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoiceReferenceNotFoundError404Response'
    Conflict:
      description: 幂等、资源状态或并发操作冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409Response'
    ListVoicesBadRequest:
      description: selectable 无效或携带未定义查询参数。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListVoicesError400Response'
    CreateVoiceBadRequest:
      description: 创建字段、multipart 或授权确认无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVoiceError400Response'
    CreateVoiceForbidden:
      description: 当前用户的 capabilities 未开放音色克隆。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVoiceError403Response'
    UpdateVoiceBadRequest:
      description: 更新请求体无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateVoiceError400Response'
    CreateReferenceBadRequest:
      description: 新增参考字段、multipart 或授权确认无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateReferenceError400Response'
    CreateVoiceConflict:
      description: 创建音色的幂等冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateVoiceError409Response'
    UpdateVoiceConflict:
      description: 默认情绪当前不可用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateVoiceError409Response'
    CreateReferenceConflict:
      description: 新增参考的幂等或 emotion 冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateReferenceError409Response'
    DeleteReferenceConflict:
      description: 身份基准或默认情绪参考不能直接删除。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteReferenceError409Response'
    DeleteConversationConflict:
      description: 当前用户自己的 conversation 仍处于 active 状态。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteConversationError409Response'
    PayloadTooLarge:
      description: 上传文件超过 capabilities 声明的限制。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error413Response'
    UnsupportedMediaType:
      description: reference_audio 声明了不支持的媒体类型。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error415Response'
    TooManyRequests:
      description: 速率或配额限制。
      headers:
        Retry-After:
          description: 可选重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429Response'
    InternalError:
      description: 后端内部错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500Response'
    ServiceUnavailable:
      description: 当前业务能力暂不可用。
      headers:
        Retry-After:
          description: 可选重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error503Response'

  schemas:
    RequestId:
      type: string
      format: uuid

    EmotionId:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,31}$'

    Failure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1

    InferenceCandidate:
      type: object
      additionalProperties: false
      required: [id, name, description, pipelines, modes]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        pipelines:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [dictation, assistant]

    NamedOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    GenerationControl:
      oneOf:
        - $ref: '#/components/schemas/NumberGenerationControl'
        - $ref: '#/components/schemas/IntegerGenerationControl'
    NumberGenerationControl:
      type: object
      additionalProperties: false
      required: [type, minimum, maximum, default]
      properties:
        type:
          const: number
        minimum:
          type: number
        maximum:
          type: number
        default:
          type: number
    IntegerGenerationControl:
      type: object
      additionalProperties: false
      required: [type, minimum, maximum, default]
      properties:
        type:
          const: integer
        minimum:
          type: integer
        maximum:
          type: integer
        default:
          type: integer

    GenerationControlMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/GenerationControl'

    OutputCapability:
      type: object
      additionalProperties: false
      required: [supported, streaming]
      properties:
        supported:
          type: boolean
        streaming:
          type: boolean
      allOf:
        - if:
            properties:
              supported:
                const: false
          then:
            properties:
              streaming:
                const: false

    PipelineOutputs:
      type: object
      additionalProperties: false
      required: [text, audio]
      properties:
        text:
          $ref: '#/components/schemas/OutputCapability'
        audio:
          allOf:
            - $ref: '#/components/schemas/OutputCapability'
            - if:
                properties:
                  supported:
                    const: true
              then:
                properties:
                  streaming:
                    const: true

    PipelineFeatures:
      type: object
      additionalProperties: false
      required:
        - input_transcription
        - outputs
        - conversation
        - turn_taking
        - interruption_trigger
        - continuation_after_interruption
        - voice_control
        - emotion_control
        - generation_controls
        - validated_conversation_turns
      properties:
        input_transcription:
          type: boolean
        outputs:
          $ref: '#/components/schemas/PipelineOutputs'
        conversation:
          type: boolean
        turn_taking:
          const: half_duplex
        interruption_trigger:
          const: explicit_client_action
        continuation_after_interruption:
          enum: [supported, unvalidated, unsupported]
        voice_control:
          enum: [none, preset, reference_clone]
        emotion_control:
          enum: [none, preset, reference_variant]
          description: >-
            可用于该 Pipeline 的 Voice 必须声明相同值；none 使用 null，preset 和
            reference_variant 均从 Voice.supported_emotions 选择。
        generation_controls:
          type: object
          additionalProperties: false
          required: [text, audio]
          properties:
            text:
              $ref: '#/components/schemas/GenerationControlMap'
            audio:
              $ref: '#/components/schemas/GenerationControlMap'
        validated_conversation_turns:
          type: [integer, 'null']
          minimum: 1

    Pipeline:
      type: object
      additionalProperties: false
      required: [id, kind, name, description, modes, max_recording_ms, features]
      properties:
        id:
          type: string
          minLength: 1
          description: 不透明的业务配置 ID，只用于引用，不携带 Pipeline 类型语义。
        kind:
          enum: [native_audio, cascade]
          description: >-
            决定 WebSocket request.start.selection 的结构；客户端不得从 id、名称或候选
            分布推断该值。v2 当前只定义 native_audio 和 cascade。
        name:
          type: string
          minLength: 1
        description:
          type: string
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [dictation, assistant]
        max_recording_ms:
          type: integer
          minimum: 1
          description: 该 Pipeline 每个实时请求预先声明的最大输入音频样本时长。
        features:
          $ref: '#/components/schemas/PipelineFeatures'

    VoiceCloningCapabilities:
      type: object
      additionalProperties: false
      required:
        - supported
        - asynchronous
        - accepted_content_types
        - min_reference_ms
        - max_reference_ms
        - recommended_reference_ms
        - effective_reference_window_ms
        - max_upload_bytes
        - emotion_reference_variants
      properties:
        supported:
          type: boolean
        asynchronous:
          type: boolean
        accepted_content_types:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^audio/'
        min_reference_ms:
          type: [integer, 'null']
          minimum: 1
        max_reference_ms:
          type: [integer, 'null']
          minimum: 1
        recommended_reference_ms:
          type: [integer, 'null']
          minimum: 1
        effective_reference_window_ms:
          type: [integer, 'null']
          minimum: 1
        max_upload_bytes:
          type: [integer, 'null']
          minimum: 1
        emotion_reference_variants:
          type: boolean
      allOf:
        - if:
            properties:
              supported:
                const: true
          then:
            properties:
              accepted_content_types:
                minItems: 1
              min_reference_ms:
                type: integer
              max_reference_ms:
                type: integer
              recommended_reference_ms:
                type: integer
              effective_reference_window_ms:
                type: integer
              max_upload_bytes:
                type: integer
              asynchronous:
                const: true
        - if:
            properties:
              supported:
                const: false
          then:
            properties:
              asynchronous:
                const: false
              accepted_content_types:
                maxItems: 0
              min_reference_ms:
                type: 'null'
              max_reference_ms:
                type: 'null'
              recommended_reference_ms:
                type: 'null'
              effective_reference_window_ms:
                type: 'null'
              max_upload_bytes:
                type: 'null'
              emotion_reference_variants:
                const: false

    Selection:
      type: object
      additionalProperties: false
      required: [model, asr, llm, tts, voice, emotion]
      properties:
        model:
          type: [string, 'null']
        asr:
          type: [string, 'null']
        llm:
          type: [string, 'null']
        tts:
          type: [string, 'null']
        voice:
          type: [string, 'null']
        emotion:
          oneOf:
            - $ref: '#/components/schemas/EmotionId'
            - type: 'null'

    DefaultSelections:
      type: object
      minProperties: 1
      additionalProperties:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/components/schemas/Selection'

    Capabilities:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - revision
        - realtime
        - voice_cloning
        - default_pipeline
        - pipelines
        - models
        - inference_options
        - recognition_languages
        - default_selections
      properties:
        protocol_version:
          const: 2
        revision:
          type: string
          minLength: 1
        realtime:
          type: object
          additionalProperties: false
          required: [websocket_path, subprotocol]
          properties:
            websocket_path:
              type: string
              pattern: '^/[^/].*'
              description: 相对于当前业务后端 origin 的同源路径。
            subprotocol:
              const: mindsurf.voice.v2
        voice_cloning:
          $ref: '#/components/schemas/VoiceCloningCapabilities'
        default_pipeline:
          type: string
          minLength: 1
        pipelines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Pipeline'
        models:
          type: array
          items:
            $ref: '#/components/schemas/InferenceCandidate'
        inference_options:
          type: object
          additionalProperties: false
          required: [asr, llm, tts]
          properties:
            asr:
              type: array
              items:
                $ref: '#/components/schemas/InferenceCandidate'
            llm:
              type: array
              items:
                $ref: '#/components/schemas/InferenceCandidate'
            tts:
              type: array
              items:
                $ref: '#/components/schemas/InferenceCandidate'
        recognition_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamedOption'
        default_selections:
          $ref: '#/components/schemas/DefaultSelections'

    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [request_id, data]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/Capabilities'

    EmotionReferenceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - emotion
        - status
        - speaker_verification
        - duration_ms
        - effective_window_ms
        - poll_after_ms
        - failure
        - created_at_ms
      properties:
        id:
          type: string
          minLength: 1
        emotion:
          $ref: '#/components/schemas/EmotionId'
        status:
          enum: [processing, ready, failed]
        speaker_verification:
          enum: [baseline, pending, matched, unverified, mismatched]
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        effective_window_ms:
          type: [integer, 'null']
          minimum: 0
        poll_after_ms:
          type: [integer, 'null']
          minimum: 1
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        created_at_ms:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              status:
                const: processing
          then:
            properties:
              speaker_verification:
                const: pending
              poll_after_ms:
                type: integer
                minimum: 1
              failure:
                type: 'null'
        - if:
            properties:
              status:
                const: ready
          then:
            properties:
              speaker_verification:
                enum: [baseline, matched, unverified]
              poll_after_ms:
                type: 'null'
              failure:
                type: 'null'
              duration_ms:
                type: integer
                minimum: 1
              effective_window_ms:
                type: integer
                minimum: 1
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              speaker_verification:
                enum: [unverified, mismatched]
              poll_after_ms:
                type: 'null'
              failure:
                $ref: '#/components/schemas/Failure'
        - if:
            properties:
              speaker_verification:
                const: mismatched
          then:
            properties:
              status:
                const: failed
              failure:
                type: object
                properties:
                  code:
                    const: speaker_mismatch

    Voice:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - source
        - status
        - quality_tier
        - selectable
        - pipelines
        - emotion_control
        - supported_emotions
        - base_reference_id
        - default_emotion
        - poll_after_ms
        - failure
        - emotion_references
        - created_at_ms
        - updated_at_ms
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        source:
          enum: [builtin, custom]
        status:
          enum: [processing, ready, failed]
        quality_tier:
          enum: [verified, unverified, preview, disabled]
        selectable:
          type: boolean
        pipelines:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        emotion_control:
          enum: [none, preset, reference_variant]
          description: 必须与 pipelines 中每个可用 Pipeline 的 features.emotion_control 相同。
        supported_emotions:
          type: array
          uniqueItems: true
          description: preset 的公开枚举，或 reference_variant 中已有 ready reference 的 emotion 集合。
          items:
            $ref: '#/components/schemas/EmotionId'
        base_reference_id:
          type: [string, 'null']
        default_emotion:
          oneOf:
            - $ref: '#/components/schemas/EmotionId'
            - type: 'null'
        poll_after_ms:
          type: [integer, 'null']
          minimum: 1
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        emotion_references:
          type: array
          items:
            $ref: '#/components/schemas/EmotionReferenceSummary'
        created_at_ms:
          type: integer
          minimum: 0
        updated_at_ms:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              source:
                const: custom
              status:
                const: processing
              emotion_control:
                const: reference_variant
            required: [source, status, emotion_control]
          then:
            properties:
              emotion_references:
                minItems: 1
                contains:
                  type: object
                  required: [status, speaker_verification]
                  properties:
                    status:
                      const: processing
                    speaker_verification:
                      const: pending
                minContains: 1
        - if:
            properties:
              status:
                const: processing
          then:
            properties:
              selectable:
                const: false
              poll_after_ms:
                type: integer
                minimum: 1
              failure:
                type: 'null'
              base_reference_id:
                type: 'null'
              default_emotion:
                type: 'null'
              supported_emotions:
                maxItems: 0
        - if:
            properties:
              status:
                const: ready
          then:
            properties:
              poll_after_ms:
                type: 'null'
              failure:
                type: 'null'
        - if:
            properties:
              status:
                const: failed
          then:
            properties:
              selectable:
                const: false
              poll_after_ms:
                type: 'null'
              failure:
                $ref: '#/components/schemas/Failure'
              base_reference_id:
                type: 'null'
              default_emotion:
                type: 'null'
              supported_emotions:
                maxItems: 0
        - if:
            properties:
              source:
                const: custom
              status:
                const: ready
              emotion_control:
                const: reference_variant
            required: [source, status, emotion_control]
          then:
            properties:
              base_reference_id:
                type: string
                minLength: 1
              default_emotion:
                $ref: '#/components/schemas/EmotionId'
              supported_emotions:
                minItems: 1
        - if:
            properties:
              emotion_control:
                const: none
            required: [emotion_control]
          then:
            properties:
              default_emotion:
                type: 'null'
              supported_emotions:
                maxItems: 0
        - if:
            properties:
              quality_tier:
                enum: [preview, disabled]
          then:
            properties:
              selectable:
                const: false

    VoiceResponse:
