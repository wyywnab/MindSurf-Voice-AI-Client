[package]
name = "mindsurf-voice-ai"
version = "0.1.0"
description = "Cross-platform desktop client for MindSurf Voice AI"
authors = ["SAST MindSurf Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindsurf_voice_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["catalina", "elcapitan"] }
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "AVCaptureDevice",
  "AVMediaFormat",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "objc2-core-foundation",
  "NSApplication",
  "NSColor",
  "NSGraphics",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGEvent",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSProcessInfo",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "WKPreferences",
  "WKWebView",
  "WKWebViewConfiguration",
] }
